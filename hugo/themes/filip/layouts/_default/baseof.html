<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header>
    {{ partial "header.html" . }}
  </header>
  <div class="container">
    <main>
      {{ block "main" . }}{{ end }}
    </main>
  </div>
  <footer class="bg-bg1 text-white text-center p-4 mt-4">
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
