baseURL = "https://filipcio12.github.io/filipdev/"
languageCode = "pl-pl"
title = "Filip Fajfer's Webpage"

defaultContentLanguage = "pl"

[languages]
  [languages.en]
    languageCode = "en"
    contentDir = "content/en"
    title = "Filip Fajfer's Blog"
  [languages.pl]
    languageCode = "pl"
    contentDir = "content/pl"
    title = "Blog Filipa Fajfera"
  
[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['\[', '\]'], ['$$', '$$']]
  inline = [['$', '$'], ['\(', '\)']]